info:
  name: List Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/users"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/users"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/plain
      body:
        type: text
        data: |-
          [
            {
              "id": 0,
              "name": "",
              "email": "",
              "role": ""
            }
          ]
  - name: Example List Users
    request:
      url: "{{baseUrl}}/api/users"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: access-control-allow-credentials
          value: "true"
        - name: vary
          value: "*"
        - name: access-control-allow-origin
          value: "*"
        - name: access-control-allow-methods
          value: GET
        - name: access-control-allow-headers
          value: accept, user-agent, accept-encoding, host, connection, request-start-time
        - name: access-control-expose-headers
          value: accept, user-agent, accept-encoding, host, connection, request-start-time
        - name: content-type
          value: application/json;charset=utf-8
        - name: date
          value: Sat, 15 Aug 2026 15:20:17 GMT
        - name: content-length
          value: "148"
      body:
        type: json
        data: |-
          [
            {
              "id": 1,
              "name": "Alice Dupont",
              "email": "alice@example.com",
              "role": "admin"
            },
            {
              "id": 2,
              "name": "Bob Martin",
              "email": "bob@example.com",
              "role": "customer"
            }
          ]
